<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hand gesture recognition using deep learning</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Saira:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link href="../static/css/index.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Spinner Start -->
    <div
      id="spinner"
      class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
    >
      <div class="spinner-grow text-primary" role="status"></div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar Start -->
    <div class="container-fluid fixed-top px-0 pt-5 pb-2">
      <h1 class="fw-bold m-0 text-center">
        <span style="color: #00bfff">Hand Gesture</span>
        <span style="color: #32cd32">Recognition</span>
      </h1>
    </div>
    <!-- Navbar End -->

    <!-- Page Header Start -->
    <div class="container-fluid page-header mb-5">
      <div class="container text-center">
        <p class="lead fw-semibold text-white">
          Upload an image showing:
          <span class="text_yellow">Open Hand</span>,
          <span class="text_yellow">Thumbs Up</span>,
          <span class="text_yellow">Peace</span>,
          <span class="text_yellow">OK</span>, or
          <span class="text_yellow">No Hand</span>
        </p>
      </div>
    </div>

    <!-- Page Header End -->

    <!-- Upload Section Start -->
    <div class="limiter">
      <div class="container-login100">
        <div class="wrap-login100 fade-in-up">
          <div class="login100-form-title">
            <div
              class="d-inline-block rounded-pill bg-light text-primary py-2 px-4 mb-3"
            >
              <i class="fas fa-cloud-upload-alt me-2"></i>Upload Image
            </div>
          </div>

          <form
            class="login100-form validate-form"
            action="/submit"
            method="POST"
            enctype="multipart/form-data"
          >
            <div
              class="wrap-input100 validate-input"
              data-validate="Image is required"
            >
              <label for="imagefile" class="form-label text-muted"
                >Choose an image file</label
              >
              <input
                class="input100 form-control"
                type="file"
                name="my_image"
                id="imagefile"
                accept="image/*"
                onchange="previewImage();"
                required
              />
            </div>

            <!-- Image Preview -->
            <div class="d-flex justify-content-center">
              <img id="preview" alt="Image Preview" />
            </div>

            <div class="container-login100-form-btn">
              <button class="btn button-blue text-white" type="submit">
                <i class="fas fa-brain me-2"></i>Analyze Gesture
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <!-- Upload Section End -->

    <!-- JavaScript Libraries -->
    <script>
      function previewImage() {
        var file = document.getElementById("imagefile").files;
        var preview = document.getElementById("preview");

        if (file.length > 0) {
          var fileReader = new FileReader();

          fileReader.onload = function (event) {
            preview.setAttribute("src", event.target.result);
            preview.style.display = "block";
          };

          fileReader.readAsDataURL(file[0]);
        } else {
          preview.style.display = "none";
        }
      }

      // Hide spinner when page loads
      window.addEventListener("load", function () {
        document.getElementById("spinner").classList.remove("show");
      });

      // Form validation
      document
        .querySelector(".login100-form")
        .addEventListener("submit", function (e) {
          var fileInput = document.getElementById("imagefile");
          if (!fileInput.files.length) {
            e.preventDefault();
            fileInput.classList.add("is-invalid");
          } else {
            fileInput.classList.remove("is-invalid");
          }
        });
    </script>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/lib/wow/wow.min.js"></script>

    <!-- Template Javascript -->
    <script src="../static/js/main.js"></script>
  </body>
</html>
