<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hand gesture recognition using deep learning</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta content="" name="keywords" />
    <meta content="" name="description" />

    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Custom Stylesheet -->
    <link href="../static/css/prediction.css" rel="stylesheet" />
  </head>

  <body>
    <!-- Header Start -->
    <header class="header">
      <div class="container">
        <nav class="navbar">
          <div class="navbar-brand">
            <h1>Hand Gesture <span>Recognition</span></h1>
          </div>
          <div class="navbar-nav">
            <a href="{{url_for('index')}}" class="nav-link">Home</a>
          </div>
        </nav>
      </div>
    </header>
    <!-- Header End -->

    <!-- Hero Section Start -->
    <section class="hero-section">
      <div class="container">
        <div class="hero-content"></div>
      </div>
    </section>
    <!-- Hero Section End -->

    <!-- Upload Section Start -->
    <section class="upload-section">
      <div class="container">
        <div class="upload-container">
          <div class="upload-card">
            {% if prediction %}
            <!-- Results Display -->
            <div class="results-container">
              <div class="uploaded-image">
                <img
                  src="{{img_path}}"
                  height="300px"
                  width="300px"
                  alt="Uploaded gesture"
                />
              </div>
              <div class="prediction-result">
                <h2>Hand gesture Detection is: <i>{{prediction}}</i></h2>
              </div>
              <a href="{{ url_for('index') }}" class="btn btn-secondary">
                <i class="fas fa-upload"></i> Upload Another Image
              </a>
            </div>
            {% else %}
            <!-- Upload Interface -->
            <div class="upload-form">
              <div class="upload-area">
                <div class="upload-icon">
                  <i class="fas fa-cloud-upload-alt"></i>
                </div>
                <button type="button" class="btn btn-primary upload-btn">
                  <i class="fas fa-upload"></i> Upload Image
                </button>
              </div>

              <div class="file-info">
                <div class="file-details">
                  <span class="file-text">Choose an image file</span>
                  <input type="file" class="file-input" accept="image/*" />
                  <span class="file-name">7.png</span>
                </div>
                <div class="file-status">Please select a valid image file.</div>
              </div>

              <button type="submit" class="btn btn-analyze">
                <i class="fas fa-search"></i> Analyze Gesture
              </button>
            </div>
            {% endif %}
          </div>
        </div>
      </div>
    </section>
    <!-- Upload Section End -->

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Template Javascript -->
    <script src="../static/js/main.js"></script>
  </body>
</html>
